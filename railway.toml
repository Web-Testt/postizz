[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'sed -i \"s/listen 5000;/listen ${PORT:-5000};/g\" /etc/nginx/nginx.conf && nginx && pnpm run pm2'"
healthcheckPath = "/api"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10